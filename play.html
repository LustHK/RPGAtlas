<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RPGAtlas Player</title>
    <link rel="icon" type="image/svg+xml" href="img/system/rpgatlas-logo.svg" />
    <link rel="stylesheet" href="css/play.css?v=9" />
  </head>
  <body>
    <div id="stage">
      <canvas id="gamecanvas"></canvas>
    </div>
    <script>
      // Support loading a project from a folder path via ?projectPath= URL parameter
      // This is used for standalone folder-based playback and future Tauri playtest.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var projectPath = params.get("projectPath");
        if (projectPath) {
          window.RPGATLAS_PROJECT_PATH = projectPath;
        }
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.x/dist/pixi.min.js"></script>
    <script src="js/vendor/pixi.min.js?v=8.19.0"></script>
    <script src="js/assets.js?v=1"></script>
    <script src="js/i18n.js?v=1"></script>
    <script src="js/renderer.js?v=1"></script>
    <script src="js/post-processing.js?v=1"></script>
    <script src="js/particles.js?v=1"></script>
    <script src="js/runtime/messages.js?v=1"></script>
    <script src="js/sfx.js?v=8"></script>
    <script src="js/plugins.js?v=8"></script>
    <script src="js/data.js?v=14"></script>
    <script src="js/physics.js?v=1"></script>
    <script>
      window.RPGAtlasDeps = {
        Assets,
        AtlasBuiltins: window.AtlasBuiltins,
        DataDefaults: window.DataDefaults,
        Renderer,
        GLRender: Renderer,
        Music: window.Music,
        RA: window.RA,
        Sfx: window.Sfx,
      };
    </script>
    <script src="js/quests.js?v=1"></script>
    <script src="js/journal-view.js?v=1"></script>
    <script src="js/engine.js?v=18"></script>
  </body>
</html>
